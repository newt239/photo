packages:
  - "./"
allowBuilds:
  "@clerk/shared": true
  better-sqlite3: true
  esbuild: true
  lefthook: true
  sharp: true
  workerd: true
saveExact: true
minimumReleaseAge: 10080
# セキュリティ修正の取り込みを Cooldown で遅らせないための例外。
# js-yaml@4.3.1 は GHSA-5p4m-2wfm-xmqj (high) の修正版。
# nanoid@3.3.17 は CVE-2026-67213 (high) の修正版。
minimumReleaseAgeExclude:
  - js-yaml@4.3.1
  - nanoid@3.3.17
# postcss が引く nanoid 3.x を CVE-2026-67213 の修正版に固定する。
overrides:
  "nanoid@>=3.3.16 <4.0.0-0": "3.3.17"
