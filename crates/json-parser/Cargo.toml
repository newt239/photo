[package]
name = "json-parser"
version = "0.1.0"
edition = "2024"
description = "クライアントサイドで JSON を解析する WebAssembly モジュール"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
console_error_panic_hook = "0.1.7"
serde_json = "1.0.151"
wasm-bindgen = "0.2.126"

[profile.release]
lto = true
opt-level = "s"
